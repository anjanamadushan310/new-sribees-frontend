# =============================================================================
# SRIBEESonline Admin — End-to-end tests
#
# Runs the Playwright suite against a REAL stack on every push: PostgreSQL, the
# FastAPI backend, the seed migrations, and the production build of this app.
# Nothing is stubbed, because the bugs worth catching before a deploy all live
# in the seam between client and server — a role the API refuses, a chart that
# renders empty, two screens disagreeing about the same number. A mocked API
# reports all of those as green.
#
# The seed migrations ARE the fixture. There is no separate test-data step, so
# a broken seed fails the build here rather than on the deployed site.
#
# ---------------------------------------------------------------------------
# Setup, once:
#
#   If the backend repository is PRIVATE, add a repository secret named
#   BACKEND_REPO_TOKEN — a fine-grained PAT with read access to
#   anjanamadushan310/new-sribees-backend. If it is public, nothing is needed:
#   the job falls back to the automatic GITHUB_TOKEN.
#
#   Override BACKEND_REPO / BACKEND_REF below if either ever moves.
# ---------------------------------------------------------------------------

name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_REPO: anjanamadushan310/new-sribees-backend
  BACKEND_REF: main
  PGUSER: sribees
  PGPASSWORD: sribees
  PGDATABASE: sribees_e2e

jobs:
  e2e:
    name: Playwright against a live backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sribees
          POSTGRES_PASSWORD: sribees
          POSTGRES_DB: sribees_e2e
        ports:
          - 5432:5432
        # Without the health check the next step can connect before Postgres is
        # accepting connections, which fails as a confusing "connection refused"
        # in the middle of an unrelated step.
        options: >-
          --health-cmd "pg_isready -U sribees -d sribees_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the admin app
        uses: actions/checkout@v4
        with:
          path: admin

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: backend
          # Falls back to the automatic token, which is enough for a public
          # repository. See the setup note at the top of this file.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the backend
        working-directory: backend
        env:
          # No Redis service: rate limiting degrades to a warning without it,
          # and standing one up would buy nothing these tests assert.
          DATABASE_URL: postgresql+asyncpg://sribees:sribees@localhost:5432/sribees_e2e
          APP_ENV: development
          DEBUG: 'true'
          SECRET_KEY: e2e-only-not-a-real-secret
          # settings.py defaults media_root to /app/media, which only exists
          # inside the Docker image (WORKDIR /app). Running uvicorn directly
          # on the runner from ./backend, that path doesn't exist and isn't
          # creatable (root-owned), so startup fails before /health ever
          # responds. Point it at a directory this job can actually create.
          MEDIA_ROOT: ./media
        run: |
          # On boot the app runs SQLAlchemy create_all(), which creates the
          # tables the SQL migrations then ALTER and populate. Same order as
          # the production deploy, so CI exercises the real sequence.
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend never became healthy"
          cat "$GITHUB_WORKSPACE/backend.log"
          exit 1

      - name: Apply migrations and seed data
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: '5432'
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
          for f in $(ls -1 migrations/*.sql | sort); do
            echo "--- $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck and build
        working-directory: admin
        run: npm run build

      - name: Install Playwright browsers
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: admin
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: admin/test-results/
          retention-days: 14

      - name: Backend log
        if: failure()
        run: cat "$GITHUB_WORKSPACE/backend.log" || true
